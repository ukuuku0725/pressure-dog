    // 市区町村の選択肢を作る
    function updateCitySelect(prefecture, selectedCity = "") {
        const citySelect = document.getElementById("citySelect");

        citySelect.innerHTML =
            '<option value="">市区町村を選択してください</option>';

        if (!prefecture || !cityData[prefecture]) {
            return;
        }

        cityData[prefecture].forEach((city) => {
            const option = document.createElement("option");

            option.value = city.name;
            option.textContent = city.name;

            option.dataset.lat = city.lat;
            option.dataset.lng = city.lng;

            citySelect.appendChild(option);
        });

        if (selectedCity) {
            citySelect.value = selectedCity;
        }
    }


// Firebaseのログインとユーザー情報の処理
async function initializeUser() {

    const firebaseStart = performance.now();

    try {

        const authStart = performance.now();

        const userCredential = await signInAnonymously(auth);
        window.currentUser = userCredential.user;
        const user = window.currentUser;

        console.log("匿名ログイン成功！");
        console.log("UID:", user.uid);

        console.log(
            "⏱️ 匿名ログイン:",
            Math.round(performance.now() - authStart),
            "ms",
        );


        const userRef = doc(db, "users", user.uid);

        const firestoreReadStart = performance.now();

        const userSnap = await getDoc(userRef);

        console.log(
            "⏱️ Firestore読み込み:",
            Math.round(performance.now() - firestoreReadStart),
            "ms",
        );


        if (!userSnap.exists()) {

            // 初回アクセス
            const firestoreWriteStart = performance.now();

            await setDoc(userRef, {
                prefecture: "新潟県",
                city: "五泉市",
                notificationEnabled: true,
                createdAt: serverTimestamp(),
                lastUsedAt: serverTimestamp()
            });

            console.log(
                "⏱️ 初回Firestore保存:",
                Math.round(performance.now() - firestoreWriteStart),
                "ms",
            );


            // 画面に初期値を表示
            document.getElementById("prefectureSelect").value = "新潟県";

            updateCitySelect("新潟県", "五泉市");

            document.getElementById("currentCity").textContent =
                "新潟県五泉市";


            console.log("新しいユーザーをFirestoreに保存しました！");

        } else {

            // 2回目以降
            const userData = userSnap.data();

            window.nextWalkPressure =
                userData.nextWalkPressure || null;

            console.log(
                "Firestoreから取得したnextWalkPressure:",
                window.nextWalkPressure
            );

            if (userData.prefecture && userData.city) {
/*
                document.getElementById("prefectureSelect").value =
                    userData.prefecture;

                updateCitySelect(
                    userData.prefecture,
                    userData.city
                );
                */

                document.getElementById("currentCity").textContent =
                    "📍 " + userData.prefecture + userData.city;
            }

            if (userData.latitude && userData.longitude) {
                console.log("保存されている緯度:", userData.latitude);
                console.log("保存されている経度:", userData.longitude);

                localStorage.setItem("latitude", userData.latitude);
                localStorage.setItem("longitude", userData.longitude);
            }

            const firestoreUpdateStart = performance.now();

            setDoc(userRef, {
                lastUsedAt: serverTimestamp()
            }, {
                merge: true
            });

            console.log(
                "⏱️ 最終利用日時のFirestore更新:",
                Math.round(performance.now() - firestoreUpdateStart),
                "ms",
            );


            console.log("ユーザー情報を更新しました！");
        }

        console.log(
            "現在のnextWalkPressure:",
            window.nextWalkPressure
        );
        console.log("Firestoreへの保存成功！");

        console.log(
            "⏱️ initializeUser全体:",
            Math.round(performance.now() - firebaseStart),
            "ms",
        );

    } catch (error) {

        console.error("エラー:", error);

    }
}

    // 最初に地域データを読み込む
//    await loadCityData();

    // データ計測
    console.log(
        "⏱️ 地域データ読み込み:",
        Math.round(performance.now() - startupTime),
        "ms",
    );

    // app.jsを読み込む
    await new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = "app.js";

        script.onload = resolve;
        script.onerror = reject;

        document.body.appendChild(script);
    });

    // データ計測
    console.log(
        "⏱️ app.js読み込み:",
        Math.round(performance.now() - startupTime),
        "ms",
    );

    // localStorageに緯度・経度があるか確認
    const latitude = localStorage.getItem("latitude");
    const longitude = localStorage.getItem("longitude");

    let weatherPromise;

    // 緯度・経度がある場合は、Firebaseを待たずに天気取得開始
    if (latitude && longitude) {
        console.log("📍 保存されている地域情報を使用して天気取得を開始します");

        weatherPromise = window.loadPressureChange();

        // Firebaseも並行して開始
        await initializeUser();
    } else {
        // 初回アクセスなど、緯度・経度がない場合
        // 先にFirebaseからユーザー情報を取得する
        await initializeUser();

        // Firebase完了後に天気取得
        weatherPromise = window.loadPressureChange();
    }

    // Firebase＋Firestoreの計測
    console.log(
        "⏱️ Firebase＋Firestore:",
        Math.round(performance.now() - startupTime),
        "ms",
    );

    // 天気データ取得完了を待つ
    const result = await weatherPromise;

    // データ計測
    console.log(
