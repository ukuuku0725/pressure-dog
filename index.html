<!DOCTYPE html>
<html lang="ja">
<head>

</head>

<body>

    <!-- ================================
     柴んぽ準備中画面
    ================================ -->

    <div id="loadingScreen">

        <div class="loading-title">
            柴んぽ

            準備中…

    <!-- ============================= -->
    <!-- 地域設定 -->
    <!-- ============================= -->

            </select>

        </div>

        </div>

        <button id="saveCity">
            保存

            戻る

    <!-- ======================================== -->
    <!-- V2：柴んぽ -->

    <!-- タブ -->

            🌤️
        </button>

        <button
            type="button"
            class="weather-tab"
            data-tab="next"
            id="nextWalkTab"
        >
            ---
        </button>

        <button
            type="button"
            class="weather-tab"
            data-tab="nextNext"
            id="nextNextWalkTab"
        >
            ---

    </nav>

    <!-- 今の天気 -->

    <div class="weather-card" id="currentWeatherCard">

        <h3 class="current-weather-title">今の天気</h3>

        <div class="current-weather-main">

            <!-- 左側：メインの天気 -->

                <div class="current-weather-description">

                    <div id="currentWeatherDescription"></div>

                </div>

                <div id="currentWeatherTemp"></div>

            <!-- 右側：詳細情報 -->
            <div class="current-weather">
                <div id="currentWeather"></div>
            </div>

        </div>

        <!-- 降雨予報
        <div id="rainForecastMessage"></div> -->

        <div class="current-weather-cautions">

            <h3>
                <img src="./images/icons/caution.png" alt="">
                注意ポイント
            </h3>

            <div id="currentWeatherCautions"></div>

        </div>

        <!-- 33時間予報 -->
        <div class="future-weather">

            <h3>
                このあとの天気
            </h3>

            <div
                id="futureWeather"
                class="future-weather-scroll"
            >
            </div>
        </div>
    </div>


    <!-- 次のお散歩 -->
    <div class="walk-card" id="nextWalkCard">

        <!-- 総合コンディション -->

            <div class="next-walk-condition-main">

                    <img

                    <p id="nextWalkMaxTemp">--℃</p>

                    <div

                <div class="next-walk-outfit">

                    <img

                        class="walk-outfit-image"

        </div>

        <!-- 気をつけたいこと -->
        <div

            <h3>
                <img src="./images/icons/caution.png" alt="">

        </div>

        <!-- ３時間天気 -->

        <!-- ============================= -->

            </div>

        </div>

    </div>

    <!-- 次の次のお散歩 -->
    <div class="walk-card" id="nextNextWalkCard">

        <!-- 総合コンディション -->
        <div class="next-walk-condition">

            <div class="next-walk-condition-main">

                <div class="next-walk-condition-text">
                    <h3 class="section-title condition-title">
                        <img src="./images/icons/titleicon.png" alt="">
                        お散歩コンディション
                    </h3>

                    <img
                        id="nextNextWalkCondition"

                        src="./images/judges/judge_3.png"
                        alt="お散歩コンディション"
                    >

                    <p id="nextNextWalkWeatherDescription">柴んぽ確認中…</p>
                    <p id="nextNextWalkMaxTemp">--℃</p>

                    <div

                    ></div>

                <div class="next-walk-outfit">

                    <h3 class="section-title outfit-title">

                    </h3>

                    <img

        <!-- 気をつけたいこと -->

            class="next-walk-cautions"
        >

            <h3>
                <img src="./images/icons/caution.png" alt="">
                そのほかの注意ポイント
            </h3>

            <div id="nextNextWalkCautions">
                ---
            </div>

        </div>

        <!-- 3時間天気 -->
        <div class="walk-hourly-weather">
            <div id="nextNextWalkHourlyWeather"></div>
        </div>

        <!-- ============================= -->
        <!-- 日の出・日の入り -->
        <!-- ============================= -->

        <div
            id="nextNextWalkSunInfo"
            class="walk-sun-info"
        >
            <div class="walk-sun-icon">
                <span id="nextNextWalkSunIcon">🌇</span>
            </div>

            <div class="walk-sun-main">
                <span
                    id="nextNextWalkSunLabel"
                    class="walk-sun-label"
                >
                    日の入り
                </span>

                <span
                    id="nextNextWalkSunTime"
                    class="walk-sun-time"
                >
                    --:--
                </span>
            </div>

            <div
                id="nextNextWalkSunMessage"
                class="walk-sun-message"
            >
            </div>
        </div>

        <!-- もちもの -->
        <div class="next-walk-belongings">

            <h3>
                <img src="./images/icons/belongings.png" alt="">
                もちもの
            </h3>

            <div id="nextNextWalkBelongings">

            </div>

        </div>

    </div>

</body>

</html>

<script type="module">
    // データ計測
    const startupTime = performance.now();
    console.log("🚀 起動計測開始");
    
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
        initializeAppCheck,
        ReCaptchaEnterpriseProvider,
        getToken
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check.js";
    import {
        getAuth,
        signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        deleteField,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    import {
        getFunctions,
        httpsCallable
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-functions.js";

    // Firebaseの設定
    const firebaseConfig = {
        apiKey: "AIzaSyAcmHty1o1MYvSVY5bWr45FF4VU2A41LF0",
        authDomain: "pressure-dog.firebaseapp.com",
        projectId: "pressure-dog",
        storageBucket: "pressure-dog.firebasestorage.app",
        messagingSenderId: "17166963868",
        appId: "1:17166963868:web:d693c0c7d232e7b0604959"
    };

    // localでもApp Checkを扱うために必要（ないとfunctionのgetWeatherData到達しない）
    // デバッグトークンはFireBaseAppCheckのデバッグトークンに追加済み”72da4157-9602-43d5-9b0e-704e341e0170”
    self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;

    // Firebase初期化
    const app = initializeApp(firebaseConfig);
    //　
    const appCheck = initializeAppCheck(app, {
        provider: new ReCaptchaEnterpriseProvider(
            "6Lc_-tgtAAAAALLFU1zp4S8mEWuiiddtNGIbfY2O"
        ),
        isTokenAutoRefreshEnabled: true
    });

    const auth = getAuth(app);
    const db = getFirestore(app);
    const functions = getFunctions(app, "us-central1");

    window.getWeatherData = httpsCallable(
        functions,
        "getWeatherData"
    );

    // //1分データテスト用
    // window.testMinutelyWeather = httpsCallable(
    //     functions,
    //     "testMinutelyWeather"
    // );

    // 地域データ
    let cityData = {};


    async function loadCityData() {
        try {
            const response = await fetch(
                "https://raw.githubusercontent.com/code4fukui/localgovjp/master/localgovjp.json"
            );

            if (!response.ok) {
                throw new Error("全国の地域データを読み込めませんでした");
            }

            const data = await response.json();

            cityData = {};

            data.forEach((item) => {
                if (!cityData[item.pref]) {
                    cityData[item.pref] = [];
                }

                cityData[item.pref].push({
                    name: item.city,
                    lat: Number(item.lat),
                    lng: Number(item.lng)
                });
            });

            console.log("全国の地域データを読み込みました！");
            console.log(cityData);

            const prefectureSelect =
                document.getElementById("prefectureSelect");

            Object.keys(cityData).forEach((prefecture) => {
                const option = document.createElement("option");

                option.value = prefecture;
                option.textContent = prefecture;

                prefectureSelect.appendChild(option);
            });

        } catch (error) {
            console.error("地域データの読み込みエラー:", error);
            throw error;
        }
    }


    // 市区町村の選択肢を作る
    function updateCitySelect(prefecture, selectedCity = "") {
        const citySelect = document.getElementById("citySelect");

        citySelect.innerHTML =
            '<option value="">市区町村を選択してください</option>';

        if (!prefecture || !cityData[prefecture]) {
            return;
        }

        cityData[prefecture].forEach((city) => {
            const option = document.createElement("option");

            option.value = city.name;
            option.textContent = city.name;

            option.dataset.lat = city.lat;
            option.dataset.lng = city.lng;

            citySelect.appendChild(option);
        });

        if (selectedCity) {
            citySelect.value = selectedCity;
        }
    }


// Firebaseのログインとユーザー情報の処理
async function initializeUser() {

    const firebaseStart = performance.now();

    try {

        const authStart = performance.now();
        
        const userCredential = await signInAnonymously(auth);

        window.currentUser = userCredential.user;
        const user = window.currentUser;

        console.log("匿名ログイン成功！");
        console.log("UID:", user.uid);

        console.log(
            "⏱️ 匿名ログイン:",
            Math.round(performance.now() - authStart),
            "ms",
        );

        const userRef = doc(db, "users", user.uid);

        const firestoreReadStart = performance.now();

        const userSnap = await getDoc(userRef);

        console.log(
            "⏱️ Firestore読み込み:",
            Math.round(performance.now() - firestoreReadStart),
            "ms",
        );


        if (!userSnap.exists()) {

            window.weatherCache = null;

            // 初回アクセス
            const firestoreWriteStart = performance.now();
            const DEFAULT_PREFECTURE = "新潟県";
            const DEFAULT_CITY = "新潟市";
            const DEFAULT_LATITUDE = 37.91611111;
            const DEFAULT_LONGITUDE = 139.0363889;

            await setDoc(userRef, {
                prefecture: DEFAULT_PREFECTURE,
                city: DEFAULT_CITY,
                notificationEnabled: false,
                environment: "production",
                latitude: DEFAULT_LATITUDE,
                longitude: DEFAULT_LONGITUDE,
                createdAt: serverTimestamp(),
                lastUsedAt: serverTimestamp()
            });

            localStorage.setItem(
                "latitude",
                DEFAULT_LATITUDE
            );

            localStorage.setItem(
                "longitude",
                DEFAULT_LONGITUDE
            );

            console.log(
                "⏱️ 初回Firestore保存:",
                Math.round(performance.now() - firestoreWriteStart),
                "ms",
            );


            // 画面に初期値を表示
            document.getElementById("prefectureSelect").value = "新潟県";

            updateCitySelect("新潟県", "新潟市");

            document.getElementById("currentCity").textContent =
                "新潟県新潟市";


            console.log("新しいユーザーをFirestoreに保存しました！");

        } else {

            // 2回目以降
            const userData = userSnap.data();
            window.weatherCache =
                userData.weatherCache || null;

            window.nextWalkPressure =
                userData.nextWalkPressure || null;

            console.log(
                "Firestoreから取得したnextWalkPressure:",
                window.nextWalkPressure
            );

            if (userData.prefecture && userData.city) {

                document.getElementById("currentCity").textContent =
                    "📍 " + userData.prefecture + userData.city;
            }

            if (userData.latitude && userData.longitude) {
                console.log("保存されている緯度:", userData.latitude);
                console.log("保存されている経度:", userData.longitude);

                localStorage.setItem("latitude", userData.latitude);
                localStorage.setItem("longitude", userData.longitude);
            }

            const firestoreUpdateStart = performance.now();

            setDoc(userRef, {
                lastUsedAt: serverTimestamp()
            }, {
                merge: true
            });

            console.log(
                "⏱️ 最終利用日時のFirestore更新:",
                Math.round(performance.now() - firestoreUpdateStart),
                "ms",
            );


            console.log("ユーザー情報を更新しました！");
        }

        console.log(
            "weatherCache確認:",
            window.weatherCache,
        );

        console.log(
            "現在のnextWalkPressure:",
            window.nextWalkPressure
        );
        console.log("Firestoreへの保存成功！");

        console.log(
            "⏱️ initializeUser全体:",
            Math.round(performance.now() - firebaseStart),
            "ms",
        );

    } catch (error) {

        console.error("エラー:", error);

    }
}


    // 都道府県が変更されたとき
    document
        .getElementById("prefectureSelect")
        .addEventListener("change", () => {

            const prefecture =
                document.getElementById("prefectureSelect").value;

            updateCitySelect(prefecture);
        });



    // 保存ボタン
    document
        .getElementById("saveCity")
        .addEventListener("click", async () => {

            const prefecture =
                document.getElementById("prefectureSelect").value;

            const citySelect =
                document.getElementById("citySelect");

            const city =
                citySelect.value;

            const selectedOption =
                citySelect.options[citySelect.selectedIndex];

            const lat = Number(selectedOption.dataset.lat);
            const lng = Number(selectedOption.dataset.lng);


            if (!prefecture || !city) {

                alert("都道府県と市区町村を選択してください");

                return;
            }


            const user = auth.currentUser;


            if (!user) {

                console.error("ユーザーが認証されていません");

                return;
            }


            try {

                const userRef = doc(db, "users", user.uid);


                await setDoc(userRef, {
                    prefecture: prefecture,
                    city: city,
                    latitude: lat,
                    longitude: lng,
                    lastUsedAt: serverTimestamp(),

                    // 場所変更時は古い天気キャッシュを削除
                    weatherCache: deleteField()
                }, {
                    merge: true
                });

                localStorage.setItem("latitude", lat);
                localStorage.setItem("longitude", lng);

                window.weatherCache = null;

                await window.loadPressureChange();

                document.getElementById("currentCity").textContent =
                    prefecture + city;


                console.log(
                    "地域を保存しました！",
                    prefecture,
                    city
                );


                alert("地域を保存しました！");

            } catch (error) {

                console.error("地域の保存に失敗しました:", error);

                alert("地域の保存に失敗しました");

            }
        });


    // 最初に地域データを読み込む
    await loadCityData();

    // データ計測
    console.log(
        "⏱️ 地域データ読み込み:",
        Math.round(performance.now() - startupTime),
        "ms",
    );

    // app.jsを読み込む
    await new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = "app.js";

        script.onload = resolve;
        script.onerror = reject;

        document.body.appendChild(script);
    });

    // データ計測
    console.log(
        "⏱️ app.js読み込み:",
        Math.round(performance.now() - startupTime),
        "ms",
    );

    // localStorageに緯度・経度があるか確認
    const latitude = localStorage.getItem("latitude");
    const longitude = localStorage.getItem("longitude");

    let weatherPromise;

    // Firebaseからユーザー情報を取得
    await initializeUser();

    // Firebase完了後に天気取得
    weatherPromise = window.loadPressureChange();

    // Firebase＋Firestoreの計測
    console.log(
        "⏱️ Firebase＋Firestore:",
        Math.round(performance.now() - startupTime),
        "ms",
    );

    // 天気データ取得完了を待つ
    const result = await weatherPromise;

    // データ計測
    console.log(
        "⏱️ 天気データ取得＋画面表示:",
        Math.round(performance.now() - startupTime),
        "ms",
    );

    console.log(
        "⏱️ アプリ起動完了:",
        Math.round(performance.now() - startupTime),
        "ms",
    );

    console.log("気圧変化の結果:", result);

</script>
